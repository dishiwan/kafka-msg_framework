plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.enterprise'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '21'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

ext {
    springCloudVersion = '2023.0.0'
    kafkaVersion = '3.6.1'
    oracleVersion = '23.3.0.23.09'
    redisVersion = '3.2.2'
    lombokVersion = '1.18.30'
    mapstructVersion = '1.5.5.Final'
    guavaVersion = '33.0.0-jre'
    commonsLang3Version = '3.14.0'
    commonsCollectionsVersion = '4.4'
    activeMqVersion = '6.1.0'
    micrometerVersion = '1.12.2'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    
    // Spring Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation "org.apache.kafka:kafka-clients:${kafkaVersion}"
    
    // Spring ActiveMQ (for local testing)
    implementation "org.springframework.boot:spring-boot-starter-activemq"
    implementation "org.apache.activemq:activemq-client:${activeMqVersion}"
    implementation "org.apache.activemq:activemq-pool:${activeMqVersion}"
    
    // Database
    implementation "com.oracle.database.jdbc:ojdbc11:${oracleVersion}"
    implementation "com.oracle.database.jdbc:ucp:${oracleVersion}"
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-oracle'
    
    // Redis
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation 'io.lettuce:lettuce-core:6.3.1.RELEASE'
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    
    // Utilities
    implementation "com.google.guava:guava:${guavaVersion}"
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    implementation "org.apache.commons:commons-collections4:${commonsCollectionsVersion}"
    implementation 'org.apache.commons:commons-text:1.11.0'
    
    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    
    // XML Processing & Validation
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.4'
    implementation 'com.sun.xml.bind:jaxb-impl:4.0.4'
    implementation 'org.everit.json:org.everit.json.schema:1.14.2'
    
    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    
    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    
    // Monitoring & Metrics
    implementation "io.micrometer:micrometer-core:${micrometerVersion}"
    implementation "io.micrometer:micrometer-registry-prometheus:${micrometerVersion}"
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    
    // Retry & Resilience
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:kafka:1.19.3'
    testImplementation 'org.testcontainers:oracle-xe:1.19.3'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.25.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    
    // JVM options for testing
    jvmArgs = [
        '-Xmx2g',
        '-XX:+UseG1GC',
        '-XX:MaxGCPauseMillis=100'
    ]
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/config/**',
                '**/model/**',
                '**/dto/**',
                '**/exception/**',
                '**/*Application.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
    }
}

tasks.register('bootRunDev') {
    group = 'application'
    description = 'Runs the Spring Boot application with dev profile'
    doFirst {
        tasks.bootRun.configure {
            systemProperty 'spring.profiles.active', 'dev'
        }
    }
    finalizedBy 'bootRun'
}

tasks.register('bootRunLocal') {
    group = 'application'
    description = 'Runs the Spring Boot application with local profile (ActiveMQ)'
    doFirst {
        tasks.bootRun.configure {
            systemProperty 'spring.profiles.active', 'local'
        }
    }
    finalizedBy 'bootRun'
}

// Custom task for generating deployment artifacts
tasks.register('buildForDeployment', Copy) {
    group = 'build'
    description = 'Builds and packages application for OCP deployment'
    dependsOn 'build'
    
    from 'build/libs'
    into 'build/deployment'
    include '*.jar'
}

// Performance optimization for build
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '-Xlint:unchecked',
        '-Xlint:deprecation',
        '-parameters'
    ]
    options.encoding = 'UTF-8'
}

// Optimization for JAR
tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    archiveClassifier = ''
    launchScript()
}
