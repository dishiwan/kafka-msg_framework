spring:
  application:
    name: kafka-message-processor
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
    username: ${DB_USERNAME:messaging_user}
    password: ${DB_PASSWORD:messaging_pass}
    hikari:
      poolName: MessageProcessorHikariPool
      minimumIdle: 10
      maximumPoolSize: 50
      idleTimeout: 300000
      maxLifetime: 1800000
      connectionTimeout: 30000
      leakDetectionThreshold: 60000
      connectionTestQuery: SELECT 1 FROM DUAL
      autoCommit: false
      transactionIsolation: TRANSACTION_READ_COMMITTED
      registerMbeans: true
  
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        cache:
          use_second_level_cache: false
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
        shutdown-timeout: 100ms
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:message-processor-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      max-poll-interval-ms: 300000
      session-timeout-ms: 30000
      heartbeat-interval-ms: 3000
      fetch-min-size: 1024
      fetch-max-wait-ms: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        max.partition.fetch.bytes: 1048576
        isolation.level: read_committed
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      compression-type: snappy
      linger-ms: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual
      concurrency: 10
      poll-timeout: 3000
      type: batch
      
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    pool:
      enabled: true
      max-connections: 10

# Application specific configuration
application:
  name: ${APPLICATION_NAME:messaging_app}
  db-name: ${APPLICATION_DB_NAME:MESSAGING_APP}
  
  # Message Processing Configuration
  processing:
    batch:
      size: 500
      timeout-ms: 200
    thread-pool:
      core-size: 20
      max-size: 50
      queue-capacity: 1000
      keep-alive-seconds: 60
    
    # Retry Configuration
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2.0
      max-delay-ms: 10000
      non-retriable-errors:
        - VALIDATION_ERROR
        - SCHEMA_INVALID
        - DUPLICATE_MESSAGE
        - PERMANENT_FAILURE
    
    # Hourly Retry Configuration
    hourly-retry:
      enabled: true
      cron: "0 0 * * * *"  # Every hour
      batch-size: 100
      retriable-error-codes:
        - TIMEOUT
        - CONNECTION_ERROR
        - TEMPORARY_FAILURE
        - SERVICE_UNAVAILABLE
  
  # Priority Configuration (source_name|event_type|priority)
  priority:
    default: 5
    mappings:
      - "CRITICAL_SOURCE|*|1"
      - "HIGH_PRIORITY_SOURCE|URGENT|2"
      - "STANDARD_SOURCE|*|5"
      - "*|EMERGENCY|1"
      - "*|HIGH|3"
      - "*|NORMAL|5"
      - "*|LOW|7"
  
  # Sequence Cache Configuration
  sequence:
    names: INTERNAL_SOURCE_SEQUENCE,MSG_ID_SEQUENCE,OUTGOING_MSG_SEQUENCE
    max-size: 10000
    threshold: 2000
    refresh-date-based-cache: true
  
  # Autoloader Configuration
  autoloader:
    enabled: true
    process-on-startup: true
    lock-timeout-minutes: 15
    max-retry-count: 3
  
  # Duplicate Detection Configuration
  duplicate:
    detection:
      enabled: true
      check-window-hours: 24
      use-hashcode: true
  
  # Kafka Topics Configuration
  kafka:
    topics:
      incoming: ${KAFKA_TOPIC_INCOMING:incoming-messages}
      outgoing: ${KAFKA_TOPIC_OUTGOING:outgoing-messages}
      response: ${KAFKA_TOPIC_RESPONSE:response-messages}
      ack: ${KAFKA_TOPIC_ACK:ack-messages}
      dlq: ${KAFKA_TOPIC_DLQ:dead-letter-queue}
  
  # ACK Publishers Configuration (source_name|topic_name|enabled)
  ack-publishers:
    - "SOURCE_A|ack-topic-a|true"
    - "SOURCE_B|ack-topic-b|true"
    - "SOURCE_C|ack-topic-c|true"
    - "DEFAULT|ack-default|true"

# Logging Configuration
logging:
  level:
    root: INFO
    com.enterprise.messaging: ${LOG_LEVEL:DEBUG}
    org.springframework.kafka: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/message-processor.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB

# Splunk Logging Configuration
splunk:
  logging:
    enabled: ${SPLUNK_ENABLED:false}
    project-code: ${PROJECT_CODE:MSG_PROC}
    business-unit: ${BUSINESS_UNIT:ENTERPRISE}
    environment: ${ENVIRONMENT:DEV}
    
# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
logging:
  level:
    com.enterprise.messaging: DEBUG

---
# Local Profile (ActiveMQ for testing)
spring:
  config:
    activate:
      on-profile: local
  
  kafka:
    enabled: false
  
  activemq:
    enabled: true

local:
  activemq:
    topics:
      incoming: local.incoming.messages
      outgoing: local.outgoing.messages
      response: local.response.messages
      ack: local.ack.messages

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.enterprise.messaging: INFO
    
application:
  processing:
    thread-pool:
      core-size: 50
      max-size: 100
  kafka:
    listener:
      concurrency: 20
