# Application Metadata
app.version=1.0.0
app.build.timestamp=@timestamp@
app.build.number=@buildNumber@

# Database Schema Name
db.schema.name=MESSAGING_APP

# Logging Configuration
logging.file.path=logs
logging.file.name=message-processor.log

# Thread Pool Names
thread.pool.message.processor=message-processor-pool
thread.pool.retry.executor=retry-executor-pool
thread.pool.scheduler=scheduler-pool

# Performance Monitoring
performance.monitoring.enabled=true
performance.monitoring.slow.query.threshold.ms=1000
performance.monitoring.slow.transaction.threshold.ms=5000

# Data Masking Configuration
data.masking.enabled=true
data.masking.patterns=SSN,CREDIT_CARD,EMAIL,PHONE

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.database.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.database.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=30s


# ============================================================================
# Composite Business Key Configuration
# ============================================================================
business.key.enabled=true
business.key.prefix=${BUSINESS_KEY_PREFIX:ABC}
business.key.sequence-length=6
business.key.separator=-
business.key.reset-strategy=DAILY
